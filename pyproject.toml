[project]
name = "strategy-lab"
version = "0.1.0"
description = "Algorithmic trading strategy portfolio: pairs trading & multi-factor models with rigorous backtesting"
authors = [
    {name = "oimosanAI",email = "oimosan4444@gmail.com"}
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "matplotlib (>=3.11.1,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "plotly (>=6.9.0,<7.0.0)",
    "pandas (>=3.0.5,<4.0.0)",
    "numpy (>=2.5.1,<3.0.0)",
    "scipy (>=1.18.0,<2.0.0)",
    "statsmodels (>=0.14.6,<0.15.0)",
    "yfinance (>=1.5.1,<2.0.0)",
    "pyarrow (>=25.0.0,<26.0.0)",
    "lxml (>=6.1.1,<7.0.0)"
]

[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = "statsmodels.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "yfinance.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "plotly.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "mpl_toolkits.*"
ignore_missing_imports = true

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "ruff (>=0.15.22,<0.16.0)",
    "mypy (>=2.3.0,<3.0.0)",
    "jupyter (>=1.1.1,<2.0.0)",
    "pandas-stubs (>=3.0.3.260530,<4.0.0.0)"
]

[tool.poetry.group.dashboard]
optional = true

[tool.poetry.group.dashboard.dependencies]
streamlit = ">=1.38,<2.0"
